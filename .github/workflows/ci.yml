name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Shard 0 runs only the slow FC calibration file; the other test files are
    # dealt round-robin over shards 1-5 so neighbouring (similar) files spread out.
    - name: Pick this shard's test files
      run: |
        python - <<'PY'
        import glob, os
        heavy = {"tests/test_fc_match_calibration.py"}
        files = sorted(f.replace(os.sep, "/") for f in glob.glob("tests/test_*.py"))
        rest = [f for f in files if f not in heavy]
        shard = int(os.environ["SHARD"])
        mine = sorted(heavy) if shard == 0 else rest[shard - 1::5]
        open("shard-files.txt", "w").write("\n".join(mine) + "\n")
        print(f"shard {shard}: {len(mine)} files")
        PY
      env:
        SHARD: ${{ matrix.shard }}

    # Run every test and report every failure: pytest.ini's addopts stop after
    # 5 failures and add coverage, so they are replaced here. -v prints each test
    # name as it finishes, so a killed job still shows where it stopped.
    - name: Run tests
      run: |
        mkdir -p test-results
        set +e
        python -m pytest -o addopts="" -o console_output_style=classic --disable-warnings \
          -p no:cacheprovider -v -rfE --tb=short --durations=25 \
          --junitxml=test-results/junit.xml $(cat shard-files.txt) 2>&1 | tee test-results/pytest.log
        status=${PIPESTATUS[0]}
        grep -E "^(FAILED|ERROR) " test-results/pytest.log | sort -u > test-results/failed-tests.txt || true
        {
          echo "## Shard ${{ matrix.shard }}"
          tail -n 1 test-results/pytest.log
          echo
          echo "Failing tests: $(wc -l < test-results/failed-tests.txt)"
        } >> "$GITHUB_STEP_SUMMARY"
        exit $status

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.shard }}
        path: test-results/

  test-summary:
    name: All failing tests
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Download shard results
      uses: actions/download-artifact@v4
      with:
        pattern: test-results-*
        path: all-results

    - name: List every failing test
      run: |
        cat all-results/*/failed-tests.txt 2>/dev/null | sort -u > failed-tests.txt || true
        {
          echo "## Failing tests across all shards: $(wc -l < failed-tests.txt)"
          echo
          echo '```'
          cut -c1-220 failed-tests.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload combined list
      uses: actions/upload-artifact@v4
      with:
        name: failed-tests
        path: failed-tests.txt

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run flake8
      continue-on-error: true
      run: |
        # Exclude venv and cache directories to avoid linting third-party code
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
          --exclude=venv,.venv,env,__pycache__,*.egg-info
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics \
          --exclude=venv,.venv,env,__pycache__,*.egg-info

    - name: Check formatting with black
      continue-on-error: true
      run: |
        black --check --diff .

    - name: Check import order with isort
      continue-on-error: true
      run: |
        isort --check-only --diff .

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run safety check
      continue-on-error: true
      run: |
        safety check --json

    - name: Run bandit security check
      continue-on-error: true
      run: |
        bandit -r . -f json -o bandit-report.json || true

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
