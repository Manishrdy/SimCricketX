name: Deploy to production

on:
  workflow_dispatch:

# Never run two deploys at once, and don't cancel one mid-restart.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to OCI
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy script on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          # Run the script as it exists on origin/main, not the (possibly stale)
          # copy already on disk, so deploy.sh changes take effect immediately.
          script: |
            set -e
            APP=/home/ubuntu/SimCricketX
            git -C "$APP" fetch -q origin main
            git -C "$APP" show origin/main:scripts/deploy.sh > /tmp/simcricketx_deploy.sh
            bash /tmp/simcricketx_deploy.sh
