<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SimCricketX — Text-based cricket simulators{% endblock %}
</title>
<meta name="description" content="Text-based cricket simulators for T10, T20, List A, The Hundred and First-Class. Build squads, play tournaments, create tours and explore ball-by-ball statistics.">
<link rel="canonical" href="https://simcricketx.app{{ request.path }}">
<meta property="og:title" content="SimCricketX — Text-based cricket simulators">
<meta property="og:description" content="Five formats. Seven competition structures. Your cricket world, one ball at a time.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"SimCricketX","url":"https://simcricketx.app/","applicationCategory":"GameApplication","operatingSystem":"Web browser","description":"Text-based cricket simulators for T10, T20, List A (40 or 50 overs), The Hundred and First-Class, with custom squads, seven competition structures, tours and statistics.","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<link rel="alternate" type="text/plain" href="/llms.txt" title="SimCricketX capability guide for language models">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/theme_manage.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/public.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/navigation.css') }}">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch(e) {}</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="public-nav navbar scx-nav">
<a class="nav-brand" href="/">
<span class="nav-brand-mark" aria-hidden="true"><i class="fas fa-baseball-ball"></i></span>
<span class="nav-logo-text">SimCricketX</span>
</a>
<nav class="nav-items" aria-label="Main navigation">
<a class="nav-control" href="/about"{% if request.path == '/about' %} aria-current="page"{% endif %}>About</a>{% if current_user.is_authenticated %}
<a class="button nav-cta" href="/">Dashboard ↗</a>{% else %}
<a class="nav-control" href="/login">Sign In</a>
<a class="button nav-cta" href="/register">Get started ↗</a>{% endif %}
<button id="theme-toggle" class="nav-control" type="button" aria-label="Toggle color theme">
<i class="fas fa-moon theme-moon" aria-hidden="true"></i>
<i class="fas fa-sun theme-sun" aria-hidden="true"></i>
</button>
</nav>
</header>
<main id="main">{% block content %}{% endblock %}
</main>
<footer class="public-footer">
<a class="wordmark" href="/">SimCricketX</a>
<p>Text-based cricket. A world of possibilities.</p>
<nav aria-label="Footer">
<a href="/about">About</a>
<a href="/ground-conditions/guide">Conditions guide</a>
<a href="/llms.txt">LLM guide</a>
<a href="https://github.com/ManishYelam/SimCricketX">Source code ↗</a>
<a href="{{ support_url }}" target="_blank" rel="noopener noreferrer">Buy me a coffee ↗</a>
</nav>
</footer>
<script>
(function () {
    const toggle = document.getElementById('theme-toggle');
    function updateLabel() {
        const label = document.documentElement.dataset.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
        toggle.setAttribute('aria-label', label);
        toggle.title = label;
    }
    updateLabel();
    toggle.addEventListener('click', function () {
        const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        try { localStorage.setItem('theme', theme); } catch (e) {}
        updateLabel();
    });
})();
</script>
</body>
</html>
