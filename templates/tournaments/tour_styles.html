<style>
.tour-page{max-width:1050px;margin:2rem auto;padding:1.5rem;color:var(--fg)}
.tour-page h1,.tour-page h2{margin:1.4rem 0 .8rem}.tour-page p{margin:.6rem 0 1rem}
.tour-page label{display:block;margin:.8rem 0 .4rem;font-weight:600}
.tour-page input,.tour-page select{width:100%;box-sizing:border-box;padding:.75rem;border:1px solid var(--card-border,#888);border-radius:8px;background:var(--bg);color:var(--fg)}
.tour-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:1rem}
.tour-page button,.tour-link{display:inline-block;padding:.7rem 1rem;margin:.7rem .4rem .7rem 0;background:var(--accent,#3868d9);color:white;border:0;border-radius:8px;cursor:pointer;text-decoration:none}
.tour-card{border:1px solid var(--card-border,#888);border-radius:12px;padding:1rem;margin:.8rem 0;overflow-wrap:anywhere}
.tour-page table{width:100%;border-collapse:collapse}.tour-page td,.tour-page th{text-align:left;padding:.6rem;border-bottom:1px solid var(--card-border,#888)}
.tour-page summary{cursor:pointer;margin:1rem 0}.tour-page .danger{background:#b83030}.tour-page nav{display:flex;flex-wrap:wrap;gap:.8rem;margin:1rem 0}
</style>
