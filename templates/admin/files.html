{% extends "admin/layout.html" %}

{% block admin_content %}
<div class="a-breadcrumb">
    <a href="/admin/dashboard"><i class="fas fa-shield-alt"></i> Admin</a>
    <span class="sep">/</span>
    <span class="current">Files</span>
</div>

<div class="admin-page-header">
    <div>
        <h1 class="admin-page-title">File Explorer</h1>
        <p class="admin-page-subtitle">View project files and directories</p>
    </div>
    <div class="admin-page-actions">
        <button id="refresh-btn" class="a-btn a-btn-secondary">
            <i class="fas fa-sync-alt"></i> Refresh
        </button>
    </div>
</div>

<div class="a-toolbar">
    <div class="a-toolbar-left">
        <button id="up-dir-btn" class="a-btn a-btn-ghost a-btn-sm" title="Go up">
            <i class="fas fa-level-up-alt"></i> Up
        </button>
        <div id="breadcrumb" style="font-family: 'IBM Plex Mono', monospace; font-size: .82rem; color: var(--fg); margin-left: .5rem;">
            /
        </div>
    </div>
</div>

<div class="a-table-wrap">
    <table class="a-table a-table-pro" id="file-table">
        <thead>
            <tr>
                <th style="width: 40px;"></th>
                <th class="sortable">Name</th>
                <th class="sortable" style="width: 110px;">Size</th>
                <th class="sortable" style="width: 180px;">Modified</th>
            </tr>
        </thead>
        <tbody id="file-list-body">
            <tr>
                <td colspan="4"><div class="a-empty"><i class="fas fa-spinner fa-spin"></i><p>Loading…</p></div></td>
            </tr>
        </tbody>
    </table>
</div>

{% endblock %}

{% block extra_js %}
{{ super() }}
<script>
    let currentPath = '';

    document.addEventListener('DOMContentLoaded', () => {
        loadpath('');

        document.getElementById('refresh-btn').addEventListener('click', () => {
            loadpath(currentPath);
        });

        document.getElementById('up-dir-btn').addEventListener('click', () => {
            if (currentPath) {
                const parts = currentPath.split('/');
                parts.pop();
                loadpath(parts.join('/'));
            }
        });
    });

    async function loadpath(path) {
        const tbody = document.getElementById('file-list-body');
        tbody.innerHTML = '<tr><td colspan="4"><div class="a-empty"><i class="fas fa-spinner fa-spin"></i><p>Loading…</p></div></td></tr>';

        try {
            const res = await fetch(`/admin/api/files?path=${encodeURIComponent(path)}`);
            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error || 'Failed to load files');
            }
            const data = await res.json();
            renderFiles(data);
        } catch (error) {
            tbody.innerHTML = '<tr><td colspan="4"><div class="a-empty"><i class="fas fa-exclamation-circle"></i><p></p></div></td></tr>';
            tbody.querySelector('.a-empty p').textContent = error.message;
        }
    }

    function renderFiles(data) {
        const tbody = document.getElementById('file-list-body');
        const breadcrumb = document.getElementById('breadcrumb');
        const upBtn = document.getElementById('up-dir-btn');

        currentPath = data.current_path;

        // Filenames and paths come straight from the server's filesystem listing —
        // never trust them as HTML. Everything below is built with createElement /
        // textContent (or dataset for click targets) so a crafted filename like
        // `<img src=x onerror=...>` can only ever render as inert text.
        breadcrumb.innerHTML = '';
        if (!data.current_path) {
            const root = document.createElement('span');
            root.style.fontWeight = 'bold';
            root.textContent = 'Root';
            breadcrumb.appendChild(root);
            upBtn.disabled = true;
            upBtn.style.opacity = '0.5';
        } else {
            const rootLink = document.createElement('span');
            rootLink.className = 'breadcrumb-link';
            rootLink.style.cursor = 'pointer';
            rootLink.style.color = 'var(--accent)';
            rootLink.textContent = 'Root';
            rootLink.addEventListener('click', () => loadpath(''));
            breadcrumb.appendChild(rootLink);

            const parts = data.current_path.split('/');
            let builtPath = '';
            parts.forEach((part, index) => {
                builtPath += (builtPath ? '/' : '') + part;
                const sep = document.createElement('i');
                sep.className = 'fas fa-chevron-right';
                sep.style.cssText = 'font-size:.68em; opacity:.5; margin:0 .28rem;';
                breadcrumb.appendChild(document.createTextNode(' '));
                breadcrumb.appendChild(sep);
                breadcrumb.appendChild(document.createTextNode(' '));

                if (index === parts.length - 1) {
                    const span = document.createElement('span');
                    span.textContent = part;
                    breadcrumb.appendChild(span);
                } else {
                    const link = document.createElement('span');
                    link.className = 'breadcrumb-link';
                    link.style.cursor = 'pointer';
                    link.style.color = 'var(--accent)';
                    link.textContent = part;
                    const targetPath = builtPath;
                    link.addEventListener('click', () => loadpath(targetPath));
                    breadcrumb.appendChild(link);
                }
            });
            upBtn.disabled = false;
            upBtn.style.opacity = '1';
            upBtn.onclick = () => loadpath(data.parent_path);
        }

        tbody.innerHTML = '';
        if (data.items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4"><div class="a-empty"><i class="fas fa-folder-open"></i><p>This folder is empty</p></div></td></tr>';
            return;
        }

        data.items.forEach(item => {
            const iconClass = item.is_dir ? 'fa-folder' : getFileIcon(item.name);
            const iconColor = item.is_dir ? '#fbbf24' : 'var(--fg-secondary)';

            const tr = document.createElement('tr');
            if (item.is_dir) {
                tr.style.cursor = 'pointer';
                tr.className = 'folder-row';
                tr.addEventListener('click', () => loadpath(item.path));
            }

            const iconTd = document.createElement('td');
            iconTd.style.textAlign = 'center';
            const icon = document.createElement('i');
            icon.className = `fas ${iconClass}`;
            icon.style.color = iconColor;
            icon.style.fontSize = '1rem';
            iconTd.appendChild(icon);

            const nameTd = document.createElement('td');
            const nameDiv = document.createElement('div');
            nameDiv.style.cssText = item.is_dir
                ? 'font-weight:600; cursor:pointer; color:var(--fg);'
                : 'color:var(--fg);';
            nameDiv.textContent = item.name;
            nameTd.appendChild(nameDiv);

            const sizeTd = document.createElement('td');
            sizeTd.className = 'a-cell-mono a-cell-dim';
            sizeTd.dataset.sort = item.size;
            sizeTd.textContent = formatSize(item.size);

            const modTd = document.createElement('td');
            modTd.className = 'a-cell-dim';
            modTd.style.cssText = 'display:flex; justify-content:space-between; align-items:center;';
            const modSpan = document.createElement('span');
            modSpan.textContent = item.modified;
            modTd.appendChild(modSpan);

            if (!item.is_dir) {
                const delBtn = document.createElement('button');
                delBtn.className = 'a-btn a-btn-ghost a-btn-sm';
                delBtn.style.cssText = 'color:#dc2626; padding:.1rem .4rem;';
                delBtn.title = 'Delete File';
                delBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
                delBtn.addEventListener('click', (event) => deleteFile(item.path, item.name, event));
                modTd.appendChild(delBtn);
            }

            tr.appendChild(iconTd);
            tr.appendChild(nameTd);
            tr.appendChild(sizeTd);
            tr.appendChild(modTd);
            tbody.appendChild(tr);
        });
    }

    async function deleteFile(path, name, event) {
        event.stopPropagation();

        if (!confirm(`Are you sure you want to delete "${name}"?\nThis action cannot be undone.`)) {
            return;
        }

        try {
            const res = await fetch(`/admin/api/files?path=${encodeURIComponent(path)}`, {
                method: 'DELETE',
                headers: {
                    'X-CSRFToken': document.querySelector('meta[name="csrf-token"]')?.content
                }
            });

            if (res.ok) {
                loadpath(currentPath);
            } else {
                const data = await res.json();
                alert(`Error deleting file: ${data.error}`);
            }
        } catch (error) {
            alert(`Error deleting file: ${error.message}`);
        }
    }

    function formatSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function getFileIcon(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        switch (ext) {
            case 'py': return 'fa-python';
            case 'html': return 'fa-html5';
            case 'css': return 'fa-css3-alt';
            case 'js': return 'fa-js';
            case 'json': return 'fa-code';
            case 'db': return 'fa-database';
            case 'md': case 'txt': return 'fa-file-alt';
            case 'jpg': case 'jpeg': case 'png': case 'gif': case 'webp': return 'fa-image';
            case 'zip': case 'rar': case '7z': return 'fa-file-archive';
            default: return 'fa-file';
        }
    }
</script>

<style>
    .folder-row:hover { background-color: var(--accent-light) !important; }
    .breadcrumb-link:hover { text-decoration: underline; }
</style>
{% endblock %}
