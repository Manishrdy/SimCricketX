# Include inside nginx's http {} context. Deliberately omit URL/query, IP,
# cookies, authorization and bodies; route patterns are in Flask's logs.
log_format scx_timing escape=json
  '{"timestamp":"$time_iso8601","request_id":"$request_id",'
  '"cf_ray":"$http_cf_ray","method":"$request_method",'
  '"status":$status,"bytes":$body_bytes_sent,'
  '"request_time":"$request_time",'
  '"upstream_connect_time":"$upstream_connect_time",'
  '"upstream_header_time":"$upstream_header_time",'
  '"upstream_response_time":"$upstream_response_time",'
  '"upstream_status":"$upstream_status"}';

# In the EXISTING SimCricketX server {} block:
# access_log /var/log/nginx/simcricketx_access.log scx_timing;
# error_log /var/log/nginx/simcricketx_error.log warn;
#
# In EVERY existing location that proxies to Gunicorn, alongside its existing
# proxy_set_header directives (preserve Host, forwarded headers and WebSockets):
# proxy_set_header X-Request-ID $request_id;
# proxy_set_header CF-Ray $http_cf_ray;
