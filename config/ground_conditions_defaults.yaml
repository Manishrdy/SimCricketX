      middle:
        all:
          Dot: 1.05
      pp1:
        all:
          Wicket: 1.05
        pitch:
          Flat:
            Four: 1.14
            Six: 1.12
          Hard:
            Four: 1.1
            Six: 1.08
    pitch_wear:
      Dead:
        factors:
          Four: 0.05
          Wicket: -0.08
        mode: linear
      Dry:
        factors:
          Dot: 0.2
          Four: -0.12
          Six: -0.25
          Wicket: 0.45
        mode: linear
      Flat:
        factors:
          Four: 0.05
          Wicket: -0.08
        mode: linear
      Green:
        factors:
          Four: 0.1
          Six: 0.08
          Wicket: -0.18
        mode: late
        threshold: 0.3
      Hard:
        factors:
          Dot: 0.05
          Wicket: 0.12
        mode: linear
    dew:
      factors:
        Extras: 0.4
        Four: 0.1
        Wicket: -0.15
      peak_over: 44
      start_over: 24
    blending:
      pitch_weight: 0.6
      skill_weight: 0.4
