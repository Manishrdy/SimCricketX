# SimCricketX Ground Conditions — factory defaults
#
# Canonical source of truth for the pitch model. Every number the engine uses
# for pitch behaviour lives here; engine/ball_outcome.py reads them via
# engine/ground_config.py rather than holding its own copies.
#
# Structure is keyed by match format. A user's saved config is deep-merged OVER
# this file at read time, so any value added here reaches existing users even
# if they saved a config before it existed.
#
# All scoring_matrix / scoring_matrices values must sum to ~1.0.
# Edit via the Ground Conditions UI, or here for the shipped defaults.

version: 2

formats:
  T20:
    # "auto" lets the engine pick a game mode per delivery from match state.
    # Naming a mode instead pins it for every ball of every match.
    active_game_mode: auto

    # ─── PITCH PROFILES ───
    pitch_profiles:
      # Target band: 110-150 runs, 7-10 wickets. Pace takes ~75% of the wickets.
      Green:
        description: "Seamer-friendly surface with lateral movement — pace bowlers dominate, low scoring"
        scoring_matrix:
          Dot: 0.334
          Single: 0.368
          Double: 0.090
          Three: 0.005
          Four: 0.081
          Six: 0.030
          Wicket: 0.052
          Extras: 0.040
        run_factor: 0.85
        wicket_factors:
          Fast: 1.40
          Fast-medium: 1.20
          Medium-fast: 1.15
          Medium: 1.05
          default: 0.55

      # Target band: 110-150 runs, 7-10 wickets. Spin takes ~59% of the wickets
      # while bowling only ~40% of the overs — the per-over edge is the point.
      Dry:
        description: "Spin-friendly surface with variable bounce — spinners thrive, tough to score"
        scoring_matrix:
          Dot: 0.325
          Single: 0.368
          Double: 0.092
          Three: 0.008
          Four: 0.084
          Six: 0.032
          Wicket: 0.046
          Extras: 0.045
        run_factor: 0.85
        # Pace bowls the powerplay and the death, where the phase wicket_boost
        # lives, so a Dry spin edge is diluted by ~half before it reaches the
        # scorecard. These factors are deliberately wider than they look.
        wicket_factors:
          Leg spin: 1.62
          Wrist spin: 1.56
          Off spin: 1.50
          Finger spin: 1.38
          default: 0.34

      # Target band: 180-220 runs, 5-7 wickets.
      Hard:
        description: "True bounce with carry — balanced contest with slight batting edge"
        scoring_matrix:
          Dot: 0.286
          Single: 0.342
          Double: 0.120
          Three: 0.008
          Four: 0.107
          Six: 0.060
          Wicket: 0.047
          Extras: 0.030
        run_factor: 1.10
        wicket_factors:
          Fast: 1.10
          Fast-medium: 1.05
          Medium-fast: 1.00
          Medium: 0.95
          default: 0.90

      # Target band: 200-230 runs, 3-5 wickets.
      Flat:
        description: "True surface with even bounce — batting paradise, bowlers need skill"
        scoring_matrix:
          Dot: 0.266
          Single: 0.340
          Double: 0.140
          Three: 0.008
          Four: 0.108
          Six: 0.066
          Wicket: 0.047
          Extras: 0.025
        run_factor: 1.08
        wicket_factors:
          default: 0.85

      # Target band: 230+ runs, 1-2 wickets.
      Dead:
        description: "Lifeless track with nothing for bowlers — batting festival guaranteed"
        scoring_matrix:
          Dot: 0.245
          Single: 0.330
          Double: 0.145
          Three: 0.005
          Four: 0.134
          Six: 0.075
          Wicket: 0.031
          Extras: 0.035
        run_factor: 1.30
        wicket_factors:
          Fast: 0.60
          Fast-medium: 0.60
          Medium-fast: 0.60
          Medium: 0.60
          Off spin: 0.60
          Leg spin: 0.60
          Finger spin: 0.60
          Wrist spin: 0.60
          default: 0.60

    # ─── PHASE BOOSTS ───
    phase_boosts:
      powerplay:
        boundary_multiplier: 1.25
        overs_start: 0
        overs_end: 5
      death_overs:
        overs_start: 16
        overs_end: 19
        # 2.2 here used to push Flat/Dead death overs past 13 rpo on the base
        # matrix alone, which is where the 260+ Flat totals came from.
        boundary_boost_batting_pitch: 1.90
        boundary_boost_bowling_pitch: 1.8
        wicket_boost: 1.6
      second_innings_death:
        scoring_boost: 1.15
        wicket_boost: 1.1

    # ─── GAME MODES ───
    # Each mode applies multipliers on top of the pitch profile.
    # Values are multipliers: 1.0 = no change. After applying, probabilities are re-normalized to 1.0.
    game_modes:
      natural_game:
        label: "Natural Game"
        description: "Balanced, realistic T20 cricket simulation"
        icon: "fa-cricket-bat-ball"
        modifiers:
          dot_mult: 1.0
          single_mult: 1.0
          double_mult: 1.0
          three_mult: 1.0
          four_mult: 1.0
          six_mult: 1.0
          wicket_mult: 1.0
          extras_mult: 1.0

      aggressive:
        label: "Aggressive"
        description: "Higher boundaries, higher wickets — high risk, high reward"
        icon: "fa-bolt"
        modifiers:
          dot_mult: 0.85
          single_mult: 0.81
          double_mult: 0.90
          three_mult: 0.90
          four_mult: 1.17
          six_mult: 1.26
          wicket_mult: 1.375
          extras_mult: 0.99

      defensive:
        label: "Defensive"
        description: "More dots and singles, fewer boundaries, moderate wickets"
        icon: "fa-shield-halved"
        modifiers:
          dot_mult: 1.20
          single_mult: 1.15
          double_mult: 1.05
          three_mult: 1.0
          four_mult: 0.75
          six_mult: 0.60
          wicket_mult: 0.90
          extras_mult: 1.0

      # Match._get_dynamic_game_mode() pins this mode on Flat/Dead whenever
      # `wickets < 3 and over < 10`, so its own wicket_mult feeds back into its
      # own trigger: suppressed wickets keep the condition true, which keeps the
      # boundary multipliers running. The old 1.22/1.35/0.69 made that loop
      # self-sustaining for the whole first 10 overs. Keep these mild.
      flat_track_bully:
        label: "Flat Track Bully"
        description: "Batting paradise — minimal wickets, boundary bonanza"
        icon: "fa-fire"
        modifiers:
          dot_mult: 0.86
          single_mult: 0.86
          double_mult: 0.99
          three_mult: 0.90
          four_mult: 1.12
          six_mult: 1.20
          wicket_mult: 0.69
          extras_mult: 0.81

      bowlers_day:
        label: "Bowler's Day"
        description: "High dot rates, high wickets, low boundaries"
        icon: "fa-bowling-ball"
        modifiers:
          dot_mult: 1.30
          single_mult: 1.05
          double_mult: 0.90
          three_mult: 0.90
          four_mult: 0.65
          six_mult: 0.50
          wicket_mult: 1.50
          extras_mult: 1.10

    # ─── BLENDING WEIGHTS ───
    blending:
      pitch_weight: 0.6
      skill_weight: 0.4

  ListA:
    scoring_matrices:
      pp1:
        Dot: 0.338
        Single: 0.413
        Double: 0.118
        Three: 0.004
        Four: 0.068
        Six: 0.018
        Wicket: 0.024
        Extras: 0.017
      middle:
        Dot: 0.392
        Single: 0.443
        Double: 0.117
        Three: 0.004
        Four: 0.024
        Six: 0.006
        Wicket: 0.012
        Extras: 0.002
      death:
        Dot: 0.25
        Single: 0.354
        Double: 0.123
        Three: 0.006
        Four: 0.098
        Six: 0.052
        Wicket: 0.069
        Extras: 0.048
    pitch_profiles:
      # Target band: 200-240 runs, 7-10 wickets. Pace takes ~82% of the wickets.
      # wicket_factors is what makes that true — see the Dry note below.
      Green:
        description: Seam-friendly ODI surface — new ball talks, then batting eases
          as the shine goes
        run_factor: 0.68
        wicket_mult: 0.88
        wicket_factors:
          Fast: 1.45
          Fast-medium: 1.25
          Medium-fast: 1.18
          Medium: 1.05
          default: 0.55
        dot_single:
          Dot: 1.32
          Single: 1.06
        fine_tune:
          Four: 0.80
          Six: 0.75
      # Target band: 200-240 runs, 7-10 wickets. Spin takes ~58% of the wickets
      # off ~35% of the overs.
      #
      # wicket_factors did not exist for ListA before 2026-08-16 — there was only
      # the scalar wicket_mult, so Green and Dry handed out wickets in whatever
      # ratio the two attacks happened to bowl their overs. Both surfaces showed
      # ~67% pace, i.e. the pitch had no say in WHO took wickets, only how many.
      Dry:
        description: Spin-friendly ODI surface — grip and turn escalate sharply after
          30 overs
        run_factor: 0.72
        # Sized so wicket_mult x the weighted-average wicket_factor lands near
        # the pre-split rate (~1.1). wicket_factors REDISTRIBUTE wickets by
        # style; they must not quietly cut how many fall in total, or a
        # pace-heavy attack simply stops taking wickets on a turner.
        wicket_mult: 1.00
        # `default` is deliberately not as harsh as Green's mirror image would
        # suggest. Most attacks are pace-heavy (often 5 seamers to 2 spinners),
        # so a punitive default here suppresses most of the ATTACK rather than
        # redistributing wickets — sides then bat out all 300 balls on a
        # turner. Keep the spin:pace ratio meaningful while the weighted
        # average stays near 1.0, so total wickets hold across squad shapes.
        wicket_factors:
          Leg spin: 1.50
          Wrist spin: 1.45
          Off spin: 1.40
          Finger spin: 1.30
          default: 0.62
        dot_single:
          Dot: 1.19
          Single: 1.06
        fine_tune:
          Four: 0.95
          Six: 0.91
      # Target band: 280-320 runs, 6-8 wickets.
      Hard:
        description: True ODI track — the 280-320 baseline band
        run_factor: 0.98
        wicket_mult: 0.80
        dot_single:
          Dot: 1.0
          Single: 1.0
        fine_tune:
          Single: 1.03
          Four: 1.03
          Six: 1.03
      # Target band: 320-360 runs, 4-6 wickets.
      Flat:
        description: Batting surface — 320-360 territory
        run_factor: 1.21
        wicket_mult: 0.70
        dot_single:
          Dot: 1.0
          Single: 1.0
        fine_tune:
          Wicket: 0.85
          Dot: 0.94
          Four: 1.06
          Six: 1.1
      # Target band: 360+ runs, 2-4 wickets. Dead used to land within 6 runs of
      # Flat (347 vs 342) on the same wicket count, so the two roads were
      # effectively the same pitch; it now sits clearly above.
      Dead:
        description: Batting festival — flat, true, and unrelenting
        run_factor: 1.18
        wicket_mult: 0.40
        dot_single:
          Dot: 1.0
          Single: 1.0
        fine_tune:
          Dot: 0.84
          Four: 1.16
          Six: 1.22
    phase_boosts:
      death:
        all:
          Wicket: 1.05
        pitch:
          Flat:
            Four: 1.1
            Six: 1.15
        second_innings:
          Dot: 1.03
          Wicket: 1.08
      middle:
        all:
          Dot: 1.05
      pp1:
        all:
          Wicket: 1.05
        pitch:
          Flat:
            Four: 1.14
            Six: 1.12
          Hard:
            Four: 1.1
            Six: 1.08
    pitch_wear:
      Dead:
        factors:
          Four: 0.05
          Wicket: -0.08
        mode: linear
      Dry:
        factors:
          Dot: 0.2
          Four: -0.12
          Six: -0.25
          Wicket: 0.45
        mode: linear
      Flat:
        factors:
          Four: 0.05
          Wicket: -0.08
        mode: linear
      Green:
        factors:
          Four: 0.1
          Six: 0.08
          Wicket: -0.18
        mode: late
        threshold: 0.3
      Hard:
        factors:
          Dot: 0.05
          Wicket: 0.12
        mode: linear
    dew:
      factors:
        Extras: 0.4
        Four: 0.1
        Wicket: -0.15
      peak_over: 44
      start_over: 24
    blending:
      pitch_weight: 0.6
      skill_weight: 0.4

  # First-Class (FC): 4/5-day, up to 2 innings per side. Dot/single-dominated
  # scoring (see engine/format_config.py docstring for the "why" — boundaries
  # are a comparatively rare event, not the primary scoring route the way
  # they are in T20/ListA). Continuous match-long pitch wear (not per-innings
  # — see Match._compute_pitch_wear) is what drives both the general
  # pitch_wear curve below AND the wear-interpolated bowling-style wicket
  # factors (wicket_factors_start -> wicket_factors_end), which is the
  # mechanism that makes a Dry pitch a mild-early/raging-turner-by-day-5
  # surface instead of one static bias for the whole match.
  #
  # 2026-08-30 acceleration: every FC scoring_matrix below carries 12% more
  # probability on the scoring outcomes (Single/Double/Three/Four/Six) and 5%
  # more on Wicket than the recalibration that first set them, with Dot
  # absorbing the difference. Measured over 400 five-day matches that takes
  # the format from 3.09 to 3.43 runs an over and batting strike rates from
  # ~50 to ~56 — modern Test tempo — while leaving the draw rate at a
  # realistic 17%. The wicket bump is deliberately smaller than the scoring
  # bump: matching them exactly (x1.12 on both) holds runs-per-wicket at 30.7
  # but collapses draws to 8%, which is not first-class cricket. The cost of
  # the split is that batting averages sit a few runs above the previous
  # calibration's reference.
  #
  # 2026-09-04 pitch ladder: Flat and Dead were producing near-identical
  # first-innings totals (429 vs 413 over 60 benchmark matches each), and
  # Dead's fresh-pitch wicket factors were actually HIGHER than Flat's —
  # backwards for the deadest surface in the game. Both were lifted so the
  # five surfaces read as a ladder. Measured with scripts/bench_fc.py,
  # 100 games per pitch, first-innings total as it appears on the board
  # (all out or declared) — mean / median / 90th percentile:
  #
  #     Green 273/252/456   Dry 309/288/476   Hard 334/331/494
  #     Flat  417/420/582   Dead 508/540/662
  #
  # Use the total on the BOARD, never the all-out-only average, when
  # judging any of this: the all-out pool is censored by the declaration
  # threshold, so pushing a surface flatter moves its best innings into the
  # declared pool and the all-out mean can FALL while the pitch gets
  # easier. It did exactly that on Flat during this tuning pass.
  #
  # Flat: scoring outcomes x1.05, wicket factors x0.94, and its declaration
  # bar raised (pitch_par_factors 1.15 -> 1.22 in engine/format_config.py —
  # code, so no migration needed for that half). Dead: scoring outcomes
  # x1.10 with wicket_factors_start 0.825 -> 0.680; its late spin assistance
  # is deliberately kept near 1.0 so a long innings still runs into a worn
  # pitch rather than batting forever.
  #
  # Two things to know before retuning either of them:
  #   * Scoring and wicket tweaks alone stop working once a surface outgrows
  #     its declaration bar — sides just reach the same bar with fewer
  #     wickets down, in more overs. Flat needed BOTH the wicket cut and the
  #     par-factor raise; either alone moved its average by under 2%.
  #   * Part of Dead's lift is deliberately run RATE (4.3 RPO) rather than
  #     wicket suppression. Taking it all out of the wicket rate held the
  #     total but pushed Dead's draw rate to 57%; as shipped it is ~47%,
  #     which is what a genuine road does to a five-day match.
  # 2026-09 retune (Phase 2). Counting EVERY innings rather than all-out ones
  # only — the all-out pool hides runaway innings, because runaway innings get
  # declared — Flat was producing a 600+ total once every ten and Dead once
  # every five, against a real first-class rate nearer one in forty.
  #
  # Flat was raised: start 0.744 -> 0.800 (Fast 0.784 -> 0.845), end 0.834 ->
  # 0.900 (spin 0.922 -> 0.995). Measured: its 600+ rate halved to 4% and its
  # draw rate went 33% -> 17%. That trade is worth making.
  #
  # Dead was tried at +25% and +12% and REVERTED at both. The lever moves the
  # draw rate about five times as hard as it moves the tail: +12% bought two
  # points of 600+ rate (19% -> 17%) for ten points of draws (58% -> 17% on
  # that surface), and +25% took the whole benchmark's draw rate to 7% against
  # a real first-class ~25%. Dead's fat tail is a VARIANCE problem — the
  # spread of innings lengths, not their average — and mean wicket rate cannot
  # fix it without destroying the draw rate. Partnership grind was checked as
  # the suspected amplifier and caps at 10% wicket suppression, so that is not
  # the cause either. Leave this lever alone and treat the tail separately.
  #
  # Run rate is untouched on both surfaces: a road is a road because you score
  # quickly on it, not because you cannot be dismissed on it.
  #
  # The note below is now historical: with engine/fc_captain.py deciding
  # declarations from a forward model, _LONG_INNINGS_WINDOW_OVERS no longer
  # gates anything in normal play, so a wicket-factor change does reach the
  # tail rather than being absorbed by the declaration bar.
  #
  #   * The runaway tail is held by fc_declaration's
  #     _LONG_INNINGS_WINDOW_OVERS, not by anything in this file. Without
  #     it a side 700 for 5 with no time pressure could not declare at all
  #     and Dead produced 950-run first innings.
  # Green, Dry and Hard are untouched and still carry realistic first-class
  # numbers (~3.3-3.5 RPO, 28-36 runs per wicket).
  #
  # A stored user config deep-merges OVER these, so any change here needs a
  # migration — see migrations/reset_slow_fc_scoring.py and
  # migrations/reset_flat_dead_fc_tuning.py.
  FC:
    pitch_profiles:
      # Seam-friendly fresh pitch, eases with wear — uneven bounce and rough-assisted spin by day 4-5
      Green:
        description: "Seam-friendly fresh pitch, eases with wear — uneven bounce and rough-assisted spin by day 4-5"
        scoring_matrix:
          Dot: 0.67347
          Single: 0.20243
          Double: 0.04868
          Three: 0.00553
          Four: 0.03983
          Six: 0.00222
          Wicket: 0.01452
          Extras: 0.01333
        run_factor: 1.0
        wicket_factors_start:
          Fast: 1.078
          Fast-medium: 0.958
          Medium-fast: 0.839
          Medium: 0.718
          default: 0.52
        wicket_factors_end:
          Fast: 1.078
          Fast-medium: 1.022
          Medium-fast: 0.992
          Medium: 0.917
          Off spin: 1.132
          Leg spin: 1.132
          default: 0.917
      # Mild early, a genuine raging turner for spin by day 4-5
      Dry:
        description: "Mild early, a genuine raging turner for spin by day 4-5"
        scoring_matrix:
          Dot: 0.66712
          Single: 0.20554
          Double: 0.04973
          Three: 0.00552
          Four: 0.04199
          Six: 0.00277
          Wicket: 0.01450
          Extras: 0.01283
        run_factor: 1.0
        wicket_factors_start:
          Leg spin: 0.98
          Off spin: 0.938
          Fast: 0.852
          Medium: 0.767
          default: 0.767
        wicket_factors_end:
          Leg spin: 1.057
          Off spin: 0.989
          Finger spin: 0.924
          Wrist spin: 0.956
          Fast: 0.529
          Medium: 0.494
          default: 0.462
      # True, neutral surface — stays close to neutral throughout the match
      Hard:
        description: "True, neutral surface — stays close to neutral throughout the match"
        scoring_matrix:
          Dot: 0.65413
          Single: 0.21286
          Double: 0.05294
          Three: 0.00662
          Four: 0.04632
          Six: 0.00330
          Wicket: 0.01448
          Extras: 0.00935
        run_factor: 1.0
        wicket_factors_start:
          Fast: 0.932
          Medium: 0.842
          default: 0.842
        wicket_factors_end:
          Fast: 0.886
          Medium: 0.816
          Off spin: 0.958
          Leg spin: 0.958
          default: 0.842
      # Good batting surface — big first-innings runs, but earned over time
      Flat:
        description: "Good batting surface — big first-innings runs, but earned over time"
        scoring_matrix:
          Dot: 0.62477
          Single: 0.22884
          Double: 0.05894
          Three: 0.00694
          Four: 0.05317
          Six: 0.00404
          Wicket: 0.01445
          Extras: 0.00885
        run_factor: 1.0
        wicket_factors_start:
          Fast: 0.845
          default: 0.800
        wicket_factors_end:
          Off spin: 0.995
          Leg spin: 0.995
          default: 0.900
      # Lifeless surface, offers spin some late assistance over 5 days
      Dead:
        description: "Lifeless surface, offers spin some late assistance over 5 days"
        scoring_matrix:
          Dot: 0.59686
          Single: 0.24301
          Double: 0.06529
          Three: 0.00726
          Four: 0.06046
          Six: 0.00484
          Wicket: 0.01443
          Extras: 0.00785
        run_factor: 1.0
        wicket_factors_start:
          default: 0.680
        wicket_factors_end:
          Off spin: 0.980
          Leg spin: 0.980
          default: 0.740
    pitch_wear:
      Green:
        factors: {Dot: -0.03, Four: 0.05, Wicket: 0.05}
        mode: linear
      Dry:
        factors: {Dot: -0.05, Four: 0.03, Wicket: 0.15}
        mode: linear
      Hard:
        factors: {Dot: -0.02, Wicket: 0.04}
        mode: linear
      Flat:
        factors: {Dot: -0.02, Four: 0.04, Wicket: 0.03}
        mode: linear
      Dead:
        factors: {Dot: -0.01, Four: 0.03, Wicket: 0.02}
        mode: linear
    # Ball-condition model (Phase 2) — independent of pitch wear above and
    # of the pitch-type entirely (a new ball behaves the same on any
    # surface). A fresh new ball swings for genuine pace bowlers; that fades
    # through the middle overs; an old, roughed-up ball can then reverse-swing
    # for genuinely fast bowlers in the window just before the next new ball
    # is due. Tracked via Match.fc_ball_overs_bowled (overs bowled with the
    # CURRENT ball this innings — resets at the start of every innings and
    # whenever the new ball is taken at new_ball_swing_overs +
    # reverse_swing_window_overs, i.e. fmt.new_ball_overs).
    ball_condition:
      new_ball_swing_overs: 10
      new_ball_wicket_factors:
        Fast: 1.30
        Fast-medium: 1.20
        Medium-fast: 1.05
        default: 1.00
      # A new ball does not only take wickets — it comes onto the bat and
      # races away, and it beats bat and keeper alike. So the same window
      # that raises the edge rate also raises boundaries and byes. Unlike
      # the wicket factors these are NOT keyed by bowling style: the ball's
      # hardness is what carries it to the rope, whoever is running in.
      new_ball_scoring_factors:
        Four: 1.25
        Six: 1.15
        Extras: 1.30
        Dot: 1.02
      reverse_swing_window_overs: 15
      reverse_swing_wicket_factors:
        Fast: 1.35
        # Fast-medium bowlers reverse it too — restricting this to genuine
        # express pace left most attacks with no old-ball threat at all.
        Fast-medium: 1.18
        default: 1.00
      # An old, scuffed, reversing ball is hard work to score off: fewer
      # boundaries, more dots, and a few more extras as it goes down leg.
      reverse_swing_scoring_factors:
        Four: 0.85
        Six: 0.80
        Extras: 1.08
        Dot: 1.05
      # First-Class day/night matches use a pink ball. Its lacquer keeps the
      # conventional new-ball movement alive for longer, while the final
      # session under lights supplies an additional (style-aware) seam/swing
      # layer. These factors are deliberately separate from List A dew: FC
      # receives no second-innings dew modifier at all.
      pink_ball:
        swing_overs: 15
        new_ball_wicket_factors:
          Fast: 1.35
          Fast-medium: 1.25
          Medium-fast: 1.10
          Medium: 1.03
          default: 1.00
        new_ball_scoring_factors:
          Dot: 1.04
          Four: 1.20
          Six: 1.10
          Extras: 1.35
        under_lights_wicket_factors:
          Fast: 1.12
          Fast-medium: 1.10
          Medium-fast: 1.08
          Medium: 1.05
          default: 1.00
        under_lights_scoring_factors:
          Dot: 1.04
          Four: 0.95
          Six: 0.95
          Extras: 1.05
    # Handedness-specific rough-targeting (Phase 3): footmark rough only
    # exists where days of the same bowling angle have worn the same patch,
    # so this is a WEAR-ramped bonus (0 at a fresh pitch, full value here at
    # pitch_wear=1.0), applied on top of the flat, wear-agnostic handedness
    # bonus ball_outcome.py's compute_matchup_boost already gives every
    # format — active only for Off/Finger spin vs a Left-hand batter or
    # Leg/Wrist spin vs a Right-hand batter (see
    # get_fc_rough_targeting_factor in engine/ground_config.py). Scaled to
    # how much each surface actually breaks up: Dry (the "raging turner by
    # day 5" pitch) gets the most, true/flat surfaces the least.
    rough_targeting:
      Green: 0.15
      Dry: 0.35
      Hard: 0.08
      Flat: 0.05
      Dead: 0.25
    blending:
      pitch_weight: 0.1
      skill_weight: 0.9

