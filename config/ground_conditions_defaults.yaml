        run_factor: 0.72
        wicket_mult: 1.12
        dot_single:
          Dot: 1.2
          Single: 1.08
        fine_tune: {}
      Hard:
        description: True ODI track — the 280-320 baseline band
        run_factor: 0.98
        wicket_mult: 1.0
        dot_single:
          Dot: 1.0
          Single: 1.0
        fine_tune:
          Single: 1.03
          Four: 1.03
          Six: 1.03
      Flat:
        description: Batting surface — 320-360 territory
        run_factor: 1.21
        wicket_mult: 0.7
        dot_single:
          Dot: 1.0
          Single: 1.0
        fine_tune:
          Wicket: 0.85
          Dot: 0.94
          Four: 1.06
